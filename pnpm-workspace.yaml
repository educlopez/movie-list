# Single-package repo. The `packages` field is required by pnpm 10, which is
# what Vercel builds with; without it `pnpm install` fails on the build image.
packages:
  - "."

allowBuilds:
  # Both ship prebuilt binaries fetched by their install script.
  esbuild: true
  sharp: true

overrides:
  baseline-browser-mapping: 2.11.30
  brace-expansion@5: 5.0.12
  esbuild@0.18.20: 0.25.12
  nanoid@3: 3.3.20
  picomatch@2: 2.3.2
  postcss: 8.5.31
  source-map-js: 1.2.2
  tsx: 4.23.15
  ws: 8.22.0
