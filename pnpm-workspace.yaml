# Single-package repo. The `packages` field is required by pnpm 10, which is
# what Vercel builds with; without it `pnpm install` fails on the build image.
packages:
  - "."

allowBuilds:
  # Both ship prebuilt binaries fetched by their install script.
  esbuild: true
  sharp: true

overrides:
  "@libsql/isomorphic-ws>ws": "^8.21.0"
  "@tailwindcss/postcss>postcss": "^8.5.23"
  "brace-expansion@5": "^5.0.12"
  "nanoid@3": "^3.3.18"
  "next>baseline-browser-mapping": "^2.11.0"
  "picomatch@2": "^2.3.2"
  "source-map-js@1": "^1.2.2"
